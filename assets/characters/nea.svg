
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  width="192"
  height="192"
  shape-rendering="crispEdges"
>
  <title>Nea - Pixel Art Cat Portrait</title>

  <!-- =====================================
       BACKGROUND
       ===================================== -->

  <rect width="48" height="48" fill="#B9D4C5"/>

  <rect
    x="3" y="3"
    width="42" height="42"
    fill="#DDE9D4"
  />

  <rect
    x="5" y="5"
    width="38" height="38"
    fill="#B3C9B8"
  />

  <!-- =====================================
       BODY AND SHOULDERS
       ===================================== -->

  <!-- Body outline -->
  <rect x="9" y="36" width="30" height="12"
        fill="#514B43"/>

  <!-- Main tabby fur -->
  <rect x="11" y="37" width="26" height="11"
        fill="#8B806D"/>

  <!-- Left shoulder -->
  <rect x="7" y="40" width="10" height="8"
        fill="#827563"/>

  <!-- Right shoulder -->
  <rect x="31" y="40" width="10" height="8"
        fill="#827563"/>

  <!-- White chest -->
  <rect x="19" y="36" width="10" height="12"
        fill="#F2EDE2"/>

  <rect x="17" y="39" width="14" height="9"
        fill="#F2EDE2"/>

  <rect x="21" y="38" width="6" height="10"
        fill="#FFFFFF"/>

  <!-- Chest stripes -->
  <rect x="11" y="39" width="5" height="2"
        fill="#514B43"/>

  <rect x="32" y="39" width="5" height="2"
        fill="#514B43"/>

  <rect x="9" y="44" width="7" height="2"
        fill="#514B43"/>

  <rect x="32" y="44" width="7" height="2"
        fill="#514B43"/>

  <!-- =====================================
       EARS
       ===================================== -->

  <!-- Left ear outline -->
  <path
    d="M9 21 L9 8 L13 10 L19 16 L19 23 Z"
    fill="#514B43"
  />

  <!-- Right ear outline -->
  <path
    d="M29 23 L29 16 L35 10 L39 8 L39 21 Z"
    fill="#514B43"
  />

  <!-- Left ear fur -->
  <path
    d="M12 19 L12 12 L17 18 Z"
    fill="#B4A58D"
  />

  <!-- Right ear fur -->
  <path
    d="M31 18 L36 12 L36 19 Z"
    fill="#B4A58D"
  />

  <!-- Pink inner ears -->
  <rect x="13" y="15" width="3" height="5"
        fill="#BF8F8E"/>

  <rect x="32" y="15" width="3" height="5"
        fill="#BF8F8E"/>

  <!-- =====================================
       HEAD
       ===================================== -->

  <!-- Head outline -->
  <rect x="12" y="17" width="24" height="19"
        fill="#514B43"/>

  <rect x="10" y="23" width="28" height="10"
        fill="#514B43"/>

  <!-- Face fur -->
  <rect x="14" y="18" width="20" height="17"
        fill="#8B806D"/>

  <rect x="12" y="24" width="24" height="9"
        fill="#8B806D"/>

  <!-- Lighter cheeks -->
  <rect x="12" y="29" width="10" height="6"
        fill="#B4A58D"/>

  <rect x="26" y="29" width="10" height="6"
        fill="#B4A58D"/>

  <!-- =====================================
       TABBY FOREHEAD MARKINGS
       ===================================== -->

  <!-- Center stripe -->
  <rect x="23" y="18" width="2" height="9"
        fill="#514B43"/>

  <!-- Left stripes -->
  <rect x="17" y="19" width="3" height="6"
        fill="#514B43"/>

  <rect x="14" y="21" width="3" height="5"
        fill="#514B43"/>

  <!-- Right stripes -->
  <rect x="28" y="19" width="3" height="6"
        fill="#514B43"/>

  <rect x="31" y="21" width="3" height="5"
        fill="#514B43"/>

  <!-- Forehead highlights -->
  <rect x="20" y="20" width="2" height="5"
        fill="#C3B49B"/>

  <rect x="26" y="20" width="2" height="5"
        fill="#C3B49B"/>

  <!-- =====================================
       GREEN EYES
       ===================================== -->

  <!-- Eye outlines -->
  <rect x="15" y="26" width="8" height="7"
        fill="#3F4035"/>

  <rect x="25" y="26" width="8" height="7"
        fill="#3F4035"/>

  <!-- Green irises -->
  <rect x="16" y="27" width="6" height="5"
        fill="#83C65D"/>

  <rect x="26" y="27" width="6" height="5"
        fill="#83C65D"/>

  <!-- Pupils -->
  <rect x="19" y="27" width="2" height="5"
        fill="#1D2B25"/>

  <rect x="27" y="27" width="2" height="5"
        fill="#1D2B25"/>

  <!-- Eye highlights -->
  <rect x="17" y="27" width="2" height="2"
        fill="#E9F7C5"/>

  <rect x="30" y="27" width="2" height="2"
        fill="#E9F7C5"/>

  <!-- =====================================
       WHITE MUZZLE AND CHIN
       ===================================== -->

  <!-- Muzzle -->
  <rect x="17" y="34" width="14" height="6"
        fill="#F2EDE2"/>

  <rect x="19" y="32" width="10" height="6"
        fill="#FFFFFF"/>

  <!-- Small muzzle details -->
  <rect x="17" y="35" width="3" height="2"
        fill="#D5CEC3"/>

  <rect x="28" y="35" width="3" height="2"
        fill="#D5CEC3"/>

  <!-- Pink nose -->
  <rect x="22" y="33" width="4" height="3"
        fill="#B87978"/>

  <!-- Mouth -->
  <rect x="23" y="36" width="2" height="2"
        fill="#514B43"/>

  <rect x="21" y="38" width="2" height="1"
        fill="#514B43"/>

  <rect x="25" y="38" width="2" height="1"
        fill="#514B43"/>

  <!-- =====================================
       CHEEK STRIPES
       ===================================== -->

  <!-- Left cheek -->
  <rect x="12" y="30" width="5" height="2"
        fill="#514B43"/>

  <rect x="13" y="33" width="4" height="2"
        fill="#514B43"/>

  <!-- Right cheek -->
  <rect x="31" y="30" width="5" height="2"
        fill="#514B43"/>

  <rect x="31" y="33" width="4" height="2"
        fill="#514B43"/>

  <!-- =====================================
       WHISKERS
       ===================================== -->

  <g stroke="#EEE8DA" stroke-width="0.7">
    <path d="M19 36 L8 34"/>
    <path d="M19 38 L7 39"/>

    <path d="M29 36 L40 34"/>
    <path d="M29 38 L41 39"/>
  </g>

  <!-- =====================================
       PIXEL BORDER
       ===================================== -->

  <rect
    x="1" y="1"
    width="46" height="46"
    fill="none"
    stroke="#172B35"
    stroke-width="2"
  />
</svg>
