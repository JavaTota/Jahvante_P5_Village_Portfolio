
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  width="192"
  height="192"
  shape-rendering="crispEdges"
>
  <title>Wife Pixel Portrait</title>

  <!-- =====================================
       BACKGROUND
       ===================================== -->

  <rect width="48" height="48" fill="#B9D4C5"/>

  <rect
    x="3" y="3"
    width="42" height="42"
    fill="#DDE9D4"
  />

  <rect
    x="5" y="5"
    width="38" height="38"
    fill="#B3C9B8"
  />

  <!-- =====================================
       LONG HAIR - BACK LAYER
       ===================================== -->

  <!-- Hair silhouette -->
  <rect
    x="10" y="12"
    width="28" height="30"
    fill="#392721"
  />

  <!-- Left side of long hair -->
  <rect
    x="8" y="19"
    width="8" height="24"
    fill="#49302C"
  />

  <!-- Right side of long hair -->
  <rect
    x="32" y="19"
    width="8" height="24"
    fill="#49302C"
  />

  <!-- Lower hair strands -->
  <rect
    x="7" y="36"
    width="10" height="9"
    fill="#49302C"
  />

  <rect
    x="31" y="36"
    width="10" height="9"
    fill="#49302C"
  />

  <!-- Hair highlights -->
  <rect
    x="10" y="23"
    width="3" height="17"
    fill="#765044"
  />

  <rect
    x="35" y="24"
    width="3" height="17"
    fill="#765044"
  />

  <!-- =====================================
       SHOULDERS AND BLUE OUTFIT
       ===================================== -->

  <!-- Shoulder outline -->
  <rect
    x="10" y="38"
    width="28" height="10"
    fill="#20354B"
  />

  <!-- Main blue shirt -->
  <rect
    x="13" y="39"
    width="22" height="9"
    fill="#315E95"
  />

  <!-- Left shoulder -->
  <rect
    x="8" y="42"
    width="8" height="6"
    fill="#315E95"
  />

  <!-- Right shoulder -->
  <rect
    x="32" y="42"
    width="8" height="6"
    fill="#315E95"
  />

  <!-- Clothing highlights -->
  <rect
    x="14" y="42"
    width="4" height="6"
    fill="#547FB5"
  />

  <rect
    x="29" y="42"
    width="4" height="6"
    fill="#547FB5"
  />

  <!-- =====================================
       NECK
       ===================================== -->

  <rect
    x="20" y="32"
    width="8" height="8"
    fill="#CC9271"
  />

  <rect
    x="21" y="33"
    width="6" height="6"
    fill="#E7B28F"
  />

  <!-- =====================================
       FACE
       ===================================== -->

  <!-- Ears -->
  <rect
    x="12" y="23"
    width="4" height="7"
    fill="#CC9271"
  />

  <rect
    x="32" y="23"
    width="4" height="7"
    fill="#CC9271"
  />

  <!-- Head outline -->
  <rect
    x="14" y="14"
    width="20" height="20"
    fill="#49302C"
  />

  <!-- Main face -->
  <rect
    x="16" y="16"
    width="16" height="17"
    fill="#DDA17D"
  />

  <!-- Face highlight -->
  <rect
    x="18" y="20"
    width="12" height="11"
    fill="#E7B28F"
  />

  <!-- Cheek highlights -->
  <rect
    x="17" y="27"
    width="4" height="2"
    fill="#E9A08D"
  />

  <rect
    x="27" y="27"
    width="4" height="2"
    fill="#E9A08D"
  />

  <!-- =====================================
       HAIR - FRONT LAYER
       ===================================== -->

  <!-- Hair top -->
  <rect
    x="12" y="10"
    width="24" height="10"
    fill="#392721"
  />

  <rect
    x="15" y="8"
    width="18" height="5"
    fill="#49302C"
  />

  <!-- Natural side part -->
  <rect
    x="12" y="16"
    width="9" height="7"
    fill="#49302C"
  />

  <rect
    x="26" y="13"
    width="10" height="9"
    fill="#49302C"
  />

  <!-- Hair strands -->
  <rect
    x="11" y="20"
    width="5" height="14"
    fill="#49302C"
  />

  <rect
    x="32" y="19"
    width="5" height="16"
    fill="#49302C"
  />

  <!-- Highlights -->
  <rect
    x="17" y="10"
    width="5" height="3"
    fill="#765044"
  />

  <rect
    x="26" y="11"
    width="4" height="3"
    fill="#765044"
  />

  <rect
    x="13" y="17"
    width="3" height="7"
    fill="#765044"
  />

  <rect
    x="34" y="21"
    width="2" height="12"
    fill="#765044"
  />

  <!-- =====================================
       FACIAL DETAILS
       ===================================== -->

  <!-- Eyebrows -->
  <rect
    x="18" y="23"
    width="5" height="2"
    fill="#49302C"
  />

  <rect
    x="26" y="23"
    width="5" height="2"
    fill="#49302C"
  />

  <!-- Brown eyes -->
  <rect
    x="19" y="25"
    width="3" height="3"
    fill="#483326"
  />

  <rect
    x="27" y="25"
    width="3" height="3"
    fill="#483326"
  />

  <!-- Eye highlights -->
  <rect
    x="19" y="25"
    width="1" height="1"
    fill="#FFFFFF"
  />

  <rect
    x="27" y="25"
    width="1" height="1"
    fill="#FFFFFF"
  />

  <!-- Nose -->
  <rect
    x="24" y="27"
    width="2" height="3"
    fill="#C78F70"
  />

  <!-- Smile -->
  <rect
    x="21" y="31"
    width="7" height="1"
    fill="#8F514B"
  />

  <rect
    x="23" y="32"
    width="4" height="1"
    fill="#F3D5BC"
  />

  <!-- =====================================
       CLOTHING COLLAR
       ===================================== -->

  <rect
    x="17" y="39"
    width="5" height="4"
    fill="#254773"
  />

  <rect
    x="26" y="39"
    width="5" height="4"
    fill="#254773"
  />

  <!-- =====================================
       PIXEL BORDER
       ===================================== -->

  <rect
    x="1" y="1"
    width="46" height="46"
    fill="none"
    stroke="#172B35"
    stroke-width="2"
  />
</svg>
