
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  width="192"
  height="192"
  shape-rendering="crispEdges"
>
  <title>Jahvantè Pixel Portrait</title>

  <!-- Background -->
  <rect width="48" height="48" fill="#B9D4C5"/>

  <!-- Background decoration -->
  <rect x="3" y="3" width="42" height="42"
        fill="#DDE9D4"/>

  <rect x="5" y="5" width="38" height="38"
        fill="#9DBDAF"/>

  <!-- Shoulders and jacket -->
  <rect x="8" y="37" width="32" height="11"
        fill="#202B35"/>

  <rect x="12" y="35" width="24" height="13"
        fill="#304454"/>

  <rect x="15" y="39" width="7" height="9"
        fill="#455C6C"/>

  <rect x="26" y="39" width="7" height="9"
        fill="#455C6C"/>

  <!-- Neck -->
  <rect x="20" y="32" width="8" height="7"
        fill="#A86A48"/>

  <!-- Ears -->
  <rect x="12" y="22" width="4" height="8"
        fill="#A86A48"/>

  <rect x="32" y="22" width="4" height="8"
        fill="#A86A48"/>

  <!-- Face outline -->
  <rect x="14" y="15" width="20" height="19"
        fill="#30242A"/>

  <!-- Face -->
  <rect x="16" y="17" width="16" height="16"
        fill="#B77C55"/>

  <rect x="18" y="20" width="12" height="11"
        fill="#C68A62"/>

  <!-- Curly hair silhouette -->
  <rect x="12" y="11" width="24" height="10"
        fill="#211C22"/>

  <rect x="15" y="8" width="17" height="5"
        fill="#211C22"/>

  <rect x="18" y="6" width="5" height="5"
        fill="#211C22"/>

  <rect x="26" y="7" width="6" height="5"
        fill="#211C22"/>

  <rect x="10" y="15" width="6" height="8"
        fill="#211C22"/>

  <rect x="32" y="14" width="6" height="9"
        fill="#211C22"/>

  <!-- Individual curls -->
  <rect x="13" y="9" width="4" height="4"
        fill="#30262E"/>

  <rect x="21" y="8" width="4" height="4"
        fill="#392B33"/>

  <rect x="29" y="10" width="4" height="4"
        fill="#392B33"/>

  <rect x="17" y="13" width="5" height="4"
        fill="#30262E"/>

  <rect x="25" y="13" width="5" height="4"
        fill="#30262E"/>

  <!-- Eyebrows -->
  <rect x="18" y="22" width="5" height="2"
        fill="#30242A"/>

  <rect x="26" y="22" width="5" height="2"
        fill="#30242A"/>

  <!-- Eyes -->
  <rect x="20" y="24" width="2" height="3"
        fill="#1B2329"/>

  <rect x="27" y="24" width="2" height="3"
        fill="#1B2329"/>

  <!-- Nose -->
  <rect x="24" y="26" width="2" height="3"
        fill="#A86A48"/>

  <!-- Facial hair -->
  <rect x="18" y="30" width="12" height="3"
        fill="#3A2928"/>

  <rect x="20" y="33" width="8" height="2"
        fill="#30242A"/>

  <!-- Mouth -->
  <rect x="22" y="31" width="5" height="1"
        fill="#E2AE87"/>

  <!-- Jacket collar -->
  <rect x="17" y="37" width="5" height="4"
        fill="#182630"/>

  <rect x="26" y="37" width="5" height="4"
        fill="#182630"/>

  <!-- Pixel border -->
  <rect
    x="1"
    y="1"
    width="46"
    height="46"
    fill="none"
    stroke="#172B35"
    stroke-width="2"
  />
</svg>
